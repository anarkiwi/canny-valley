name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: qmrdk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: format
        run: docker run --rm qmrdk:ci black --check .
      - name: lint
        run: docker run --rm qmrdk:ci pylint qmrdk tests tools
      - name: test
        run: docker run --rm qmrdk:ci pytest -n auto --cov=qmrdk --cov-report=term-missing --cov-fail-under=85
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/firmware.Dockerfile
          load: true
          tags: qmrdk-firmware:ci
          cache-from: type=gha,scope=firmware
          cache-to: type=gha,mode=max,scope=firmware
      - name: format
        run: docker run --rm qmrdk-firmware:ci make format
      - name: core tests
        run: docker run --rm qmrdk-firmware:ci make test
      - name: compile
        run: docker run --rm -v "$PWD/artifacts:/out" qmrdk-firmware:ci sh -c 'make compile && cp build/radar/radar.hex build/radar/isr.lst build/radar/radar.map /out/'
      - uses: actions/upload-artifact@v7
        with:
          name: radar-firmware
          path: artifacts/
          if-no-files-found: error
